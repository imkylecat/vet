name: check

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    name: Analyze and format
    steps:
      - uses: actions/checkout@v4

      - uses: CompeyDev/setup-rokit@v0.1.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check formatting
        run: stylua --check src test

      # Not blocking yet. The new solver is required, because the type
      # functions behind Vet.infer and Vet.objectOutput are unsupported by the
      # default one, but it currently reports four errors inside those bodies
      # that come from its own definition of the `type` userdata rather than
      # from this code, and it segfaults on exit after printing them. Read the
      # output to catch regressions; flip to blocking once luau-lsp handles
      # type function bodies cleanly.
      - name: Analyze
        continue-on-error: true
        run: luau-lsp analyze --base-luaurc=.luaurc --platform=standard --flag:LuauSolverV2=true src

      # The test doubles as a type-level test of Vet.infer, so it is worth
      # analyzing with Rojo resolution and the Roblox API surface loaded.
      # Also not blocking: the default solver cannot evaluate type functions,
      # so every Vet.infer annotation reads as an unknown type.
      - name: Analyze tests
        continue-on-error: true
        run: |
          curl -sSL -o globalTypes.d.luau https://raw.githubusercontent.com/JohnnyMorganz/luau-lsp/main/scripts/globalTypes.d.luau
          rojo sourcemap dev.project.json --output sourcemap.json
          luau-lsp analyze --sourcemap=sourcemap.json --definitions=globalTypes.d.luau --base-luaurc=.luaurc --platform=roblox test
